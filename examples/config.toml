filter-acl-rules-path = "./examples/rules.acl"
# Timeouts (all in seconds, defaults shown)
handshake-timeout = 15  # Time before the initial bytes are sent.
connect-timeout = 5 # TCP connect to backend/origin (was request-timeout)
tcp_nodelay = false

[backends.par01a]
target-address = "127.0.0.2:8000"
identity-aware = true
tls-server-name = "proxy.example.com"

[backends.par01b]
target-address = "127.0.0.2:8001"

[backends.par02a]
target-address = "127.0.0.2:8002"
identity-aware = true

[backends.par02b]
target-address = "127.0.0.2:8003"

[backends.default]
target-address = "127.0.0.2:8004"

# For development, it is possible to use the test certificates:
[listener]
cacert-file = "nix/tests/certs/portail.corp/ca.cert.pem"
tls-privkey = "nix/tests/certs/portail.corp/portail.corp.example.com.key.pem"
tls-chain = "nix/tests/certs/portail.corp/portail.corp.example.com.cert.pem"

